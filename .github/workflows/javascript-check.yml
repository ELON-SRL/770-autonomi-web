name: Check JavaScript
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for file in app.js f24_ade.js movement_edits.js ravvedimenti.js st_draft.js identita.js; do
            node --check "$file"
          done
      - name: Test correction and ST rules
        run: |
          node tests/movement_edits.test.mjs
          node tests/st_draft.test.mjs
          node tests/f24_dates.test.mjs
