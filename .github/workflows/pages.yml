name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          for file in app.js practice_sequences.js practice_storage.js recipient_report.js export_current.js export_audit.js cu_reader.js f24_ade.js ledger_tree.js manual_reconciliation.js st_draft.js; do node --check "$file"; done
      - name: Regression suite
        run: |
          set -euo pipefail
          mkdir -p test-results
          for test in tests/*.test.mjs; do echo "RUN $test"; node "$test"; done 2>&1 | tee test-results/regression.log
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.58.2 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          set -o pipefail
          mkdir -p test-results
          node tests/browser_smoke.mjs 2>&1 | tee test-results/browser.log
      - name: PDF-to-browser integration test
        run: |
          set -o pipefail
          node tests/browser_pdf_integration.mjs 2>&1 | tee test-results/pdf-integration.log
      - name: Real Medicenter Ronchi PDFs browser test
        run: |
          set -o pipefail
          node tests/browser_real_pdfs.mjs 2>&1 | tee test-results/real-pdfs.log
      - name: Publish test result
        if: always()
        run: |
          mkdir -p test-results
          printf 'Commit: %s\nVerification job: %s\n' "$GITHUB_SHA" "$GITHUB_JOB" > test-results/summary.txt
      - name: Attach verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 770-verification-${{ github.sha }}
          path: test-results/
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

